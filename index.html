<style>

<div id="app"><div class="loading">Loading…</div></div>
<script>
// =============================================================================
// Yum Journal — Crumb Journal (sourdough) + Yum Journal (everyday food)
// Plain ES5 for iOS compatibility.
// =============================================================================

// ── Storage keys ─────────────────────────────────────────────────────────────
var BAKE_KEY="cj-bakes-v3", GRAIN_KEY="cj-grains-v1", RECIPE_KEY="cj-recipes-v1";
var YENTRY_KEY="yj-entries-v1", YRECIPE_KEY="yj-recipes-v1", BOOK_KEY="yj-last-book";
var IDB_NAME="crumb-journal", IDB_STORE="photos", IDB_VER=1;
var CATEGORIES=["Breakfast","Lunch","Dinner","Side","Dessert","Baking","Snack","Drink","Other"];

// ── IndexedDB (photos) ───────────────────────────────────────────────────────
var idb=null;
function openIDB(cb){
  if(idb){cb(idb);return;}
  try{
    var req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore(IDB_STORE);};
    req.onsuccess=function(e){idb=e.target.result;cb(idb);};
    req.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}
function loadPhotosK(key,cb){
  openIDB(function(db){
    if(!db){cb([]);return;}
    try{
      var req=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(key);
      req.onsuccess=function(){cb(req.result||[]);};
      req.onerror=function(){cb([]);};
    }catch(e){cb([]);}
  });
}
function savePhotosK(key,photos,cb){
  openIDB(function(db){
    if(!db){if(cb)cb();return;}
    try{
      var tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(photos||[],key);
      tx.oncomplete=function(){if(cb)cb();};
      tx.onerror=function(){if(cb)cb();};
    }catch(e){if(cb)cb();}
  });
}
function deletePhotosK(key,cb){
  openIDB(function(db){
    if(!db){if(cb)cb();return;}
    try{
      var tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE)["delete"](key);
      tx.oncomplete=function(){if(cb)cb();};
      tx.onerror=function(){if(cb)cb();};
    }catch(e){if(cb)cb();}
  });
}
function bakeKey(id){return "bake-"+id;}
function recipeKey(book,id){return (book==="crumb"?"recipe-":"yrecipe-")+id;}
function yEntryKey(id){return "yentry-"+id;}

// ── localStorage (text) ──────────────────────────────────────────────────────
function lsGet(key,fallback){try{var s=localStorage.getItem(key);return s?JSON.parse(s):fallback;}catch(e){return fallback;}}
function lsSet(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));return true;}
  catch(e){alert("Couldn't save — device storage may be full. Export a backup and remove old entries.");return false;}
}

// ── Small helpers ────────────────────────────────────────────────────────────
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function round1(x){return Math.round(x*10)/10;}
function deepCopy(o){return JSON.parse(JSON.stringify(o));}
function todayMonth(){return new Date().toISOString().slice(0,7);}
function todayDate(){var d=new Date();var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;}
function scoreBg(s){return s>=8?"#e8f0e4":s>=6?"#f5f0e0":"#f5e8e4";}
function scoreCol(s){return s>=8?"#5a7a4a":s>=6?"#8a7a3a":"#8a4a3a";}
function hasScore(s){return s!==""&&s!=null;}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function inp(ph,value,type){
  var e=document.createElement("input");
  e.type=type||"text";e.placeholder=ph||"";e.value=(value!=null)?value:"";
  if(type==="number"){e.step="any";e.setAttribute("inputmode","decimal");}
  return e;
}
function ta(ph,value,rows){var e=document.createElement("textarea");e.rows=rows||2;e.placeholder=ph||"";e.value=value||"";return e;}
function fld(label,child,hint){
  var w=el("div","fld");w.appendChild(el("div","fld-lbl",label));w.appendChild(child);
  if(hint){var h=el("div","hint",hint);h.style.margin="4px 0 0";w.appendChild(h);}
  return w;
}
function sec(title){var s=el("div","sec");s.appendChild(el("div","sec-title",title));for(var i=1;i<arguments.length;i++){if(arguments[i])s.appendChild(arguments[i]);}return s;}
function grid2(){var g=el("div","grid2");for(var i=0;i<arguments.length;i++)g.appendChild(arguments[i]);return g;}
function bindText(obj,key,ph,rows){var e=rows?ta(ph,obj[key],rows):inp(ph,obj[key]);e.oninput=function(){obj[key]=this.value;};return e;}
function bindNum(obj,key,ph,after){var e=inp(ph,obj[key],"number");e.oninput=function(){obj[key]=this.value;if(after)after();};return e;}
function showToast(msg){var t=el("div","toast",msg);document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2800);}
function showNotice(msg){var n=el("div","notice",msg);document.body.appendChild(n);return function(){if(n.parentNode)n.parentNode.removeChild(n);};}
function showLightbox(src){
  // Direct DOM overlay (no re-render) so unsaved form edits are never lost.
  var o=el("div","overlay");var img=document.createElement("img");img.src=src;o.appendChild(img);
  var b=el("button","lb-close","✕");o.appendChild(b);
  function close(){if(o.parentNode)o.parentNode.removeChild(o);}
  b.onclick=close;o.onclick=function(ev){if(ev.target===o)close();};
  document.body.appendChild(o);
}

// ── State ────────────────────────────────────────────────────────────────────
var savedBook=null;try{savedBook=localStorage.getItem(BOOK_KEY);}catch(e){}
var state={
  book: savedBook==="yum"?"yum":"crumb",
  bakes: lsGet(BAKE_KEY,[]), grains: lsGet(GRAIN_KEY,[]), recipes: lsGet(RECIPE_KEY,[]),
  yEntries: lsGet(YENTRY_KEY,[]), yRecipes: lsGet(YRECIPE_KEY,[]),
  view: null, selected:null, isNew:false,
  selectedGrain:null, isNewGrain:false,
  selectedRecipe:null, isNewRecipe:false, recipeDetail:null,
  yFilter:"All", yrFilter:"All",
  photoCache:{}
};
state.view = state.book==="crumb"?"list":"yList";
function setState(patch){for(var k in patch){if(patch.hasOwnProperty(k))state[k]=patch[k];}render();}
function switchBook(book){try{localStorage.setItem(BOOK_KEY,book);}catch(e){}setState({book:book,view:book==="crumb"?"list":"yList"});window.scrollTo(0,0);}
function getRecipes(book){return book==="crumb"?state.recipes:state.yRecipes;}
function setRecipes(book,list){if(book==="crumb"){state.recipes=list;lsSet(RECIPE_KEY,list);}else{state.yRecipes=list;lsSet(YRECIPE_KEY,list);}}
function recipeViews(book){return book==="crumb"?{list:"recipes",form:"recipeForm",detail:"recipeDetail"}:{list:"yRecipes",form:"yRecipeForm",detail:"yRecipeDetail"};}

// =============================================================================
// BAKER'S MATH
// Total flour = mix flours + levain feed flours + starter flours
// Total water = mix water + bassinage water + levain feed water + starter water
// Pass 1 % = TOTAL dough hydration after the first water addition (levain included)
//   → water to add at mix = pass1% × total flour − water already in levain
// Bassinage % = additional water as % of total flour
//   → bassinage water = bassinage% × total flour
// =============================================================================
function newSourdoughLevain(){return {buildHr:5,starter:{flours:[{name:"Hard White Wheat",grams:8}],waterG:8},flours:[{name:"Hard White Wheat",grams:32}],waterG:16};}

// Upgrade older bakes (levain stored as free-text components) to the structured levain.
// Idempotent and non-destructive: water grams you logged stay the source of truth.
function normalizeBake(b){
  if(!b||b.format==="freeform")return b;
  if(!b.flours)b.flours=[];
  for(var i=0;i<b.flours.length;i++){if(!b.flours[i].sifted)b.flours[i].sifted="No";if(b.flours[i].extraction==null)b.flours[i].extraction="";}
  if(!b.levain){b.levain={buildHr:"",starter:{flours:[],waterG:""},flours:[],waterG:""};}
  else if(!b.levain.starter){
    var old=b.levain.components||[];
    var lev={buildHr:b.levain.buildHr!=null?b.levain.buildHr:"",starter:{flours:[],waterG:0},flours:[],waterG:0};
    for(var j=0;j<old.length;j++){
      var n=(old[j].name||"").toLowerCase(),g=num(old[j].grams);
      if(!g&&!n)continue;
      if(n.indexOf("water")>=0){lev.waterG=round1(lev.waterG+g);}
      else if(n.indexOf("starter")>=0||n.indexOf("levain")>=0){
        // Assume 100% hydration starter: half flour, half water
        lev.starter.flours.push({name:"Starter flour",grams:round1(g/2)});
        lev.starter.waterG=round1(lev.starter.waterG+g/2);
      } else {lev.flours.push({name:old[j].name,grams:g});}
    }
    b.levain=lev;
  }
  if(!b.levain.starter.flours)b.levain.starter.flours=[];
  if(!b.levain.flours)b.levain.flours=[];
  if(!b.otherIngredients)b.otherIngredients=[];
  if(!b.mixins)b.mixins=[];
  if(!b.toppings)b.toppings=[];
  return b;
}
function sumGrams(list){var t=0;for(var i=0;i<(list||[]).length;i++)t+=num(list[i].grams);return t;}
function levainFlourList(b){var L=b.levain||{},S=L.starter||{};return (L.flours||[]).concat(S.flours||[]);}
function levainFlourG(b){return sumGrams(levainFlourList(b));}
function levainWaterG(b){var L=b.levain||{};return num(L.waterG)+num((L.starter||{}).waterG);}
function levainTotalG(b){return levainFlourG(b)+levainWaterG(b);}
function mixFlourG(b){return sumGrams(b.flours);}
function totalFlourG(b){if(b.format==="freeform")return 0;return mixFlourG(b)+levainFlourG(b);}
function totalWaterG(b){return num(b.water1G)+num(b.water2G)+levainWaterG(b);}
function totalHydration(b){var tf=totalFlourG(b);return tf?round1(totalWaterG(b)/tf*100):0;}
function bakersPct(g,tf){return tf?round1(num(g)/tf*100):0;}
// Loose name match so "Hard White Wheat flour" and "Hard White Wheat (fresh-milled)" count as one grain
function flourKey(name){
  var k=(name||"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/\b(fresh[\s-]*milled|freshly[\s-]*milled|fmf|flour|whole[\s-]*grain|organic)\b/g," ").replace(/[^a-z0-9]+/g," ").trim();
  return k||(name||"unnamed").toLowerCase().trim();
}
// Merge mix + levain flours so the blend reflects the whole loaf
function combinedBlend(b){
  var all=(b.flours||[]).concat(levainFlourList(b)),map={},order=[];
  for(var i=0;i<all.length;i++){
    var g=num(all[i].grams);if(!g)continue;
    var nm=(all[i].name||"Unnamed flour").trim(),k=flourKey(nm);
    if(!map[k]){map[k]={name:nm,grams:0};order.push(k);}
    map[k].grams+=g;
  }
  var tf=totalFlourG(b),out=[];
  for(var j=0;j<order.length;j++){var it=map[order[j]];out.push({name:it.name,grams:round1(it.grams),pct:tf?Math.round(it.grams/tf*100):0});}
  return out;
}
function recalcWater(f){
  var tf=totalFlourG(f),lw=levainWaterG(f);
  f.water1G=Math.max(0,Math.round(num(f.hydration1Pct)/100*tf-lw));
  f.water2G=Math.max(0,Math.round(num(f.hydration2Pct)/100*tf));
}
function derivePcts(f){
  var tf=totalFlourG(f);if(!tf)return;
  f.hydration1Pct=round1((num(f.water1G)+levainWaterG(f))/tf*100);
  f.hydration2Pct=round1(num(f.water2G)/tf*100);
}
function bakeTitle(b){
  var t="Test #"+b.testNum;
  if(b.title)t+=" · "+b.title;else if(b.format==="freeform"&&b.freeTitle)t+=" · "+b.freeTitle;
  return t;
}

function renderStatsInto(box,f){
  box.innerHTML="";
  var tf=totalFlourG(f),tw=totalWaterG(f),mix=mixFlourG(f),lev=levainTotalG(f),lf=levainFlourG(f),salt=num(f.saltG);
  var other=0;for(var i=0;i<(f.otherIngredients||[]).length;i++)other+=num(f.otherIngredients[i].amount);
  var items=[
    ["Hydration",tf?round1(tw/tf*100)+"%":"—",round1(tw)+"g water",""],
    ["Total flour",round1(tf)+"g","mix + levain",""],
    ["Salt",tf?round1(salt/tf*100)+"%":"—",salt+"g",""],
    ["Levain",round1(lev)+"g",mix?round1(lev/mix*100)+"% of mix flour":"","wide"],
    ["Prefermented",tf?round1(lf/tf*100)+"%":"—","of total flour",""],
    ["Dough weight",Math.round(tf+tw+salt+other)+"g","before mix-ins","wide"]
  ];
  for(var j=0;j<items.length;j++){
    var s=el("div","stat"+(items[j][3]?" "+items[j][3]:""));

    s.appendChild(el("div","stat-val",items[j][1]));

    box.appendChild(s);
  }
}

// Parse "500g flour", "Flour 500g", "Flour - 500g", "Flour: 2 tbsp", "1 cup milk"
function parseIngredientLine(line){
  line=line.replace(/^\s*(?:[-•*]|\d+[.)])\s+/,"").trim();
  if(!line)return null;
  var unit="(?:g|kg|ml|l|tbsp|tsp|cups?|oz|lbs?|%|grams?|cloves?|pinch|bunch|cans?)";
  var endMatch=line.match(new RegExp("^(.*?)[\\s\\-–:]+(\\d[\\d.,\\/]*\\s*"+unit+"?)\\s*$","i"));
  if(endMatch&&endMatch[1].trim())return {name:endMatch[1].trim().replace(/[\-–:,]+$/,"").trim(),amount:endMatch[2].trim()};
  var startMatch=line.match(new RegExp("^(\\d[\\d.,\\/]*\\s*"+unit+"?)\\s+(.+)$","i"));
  if(startMatch&&startMatch[2].trim())return {name:startMatch[2].trim(),amount:startMatch[1].trim()};
  return {name:line,amount:""};
}

function showPasteModal(title,hint,onDone){
  var o=el("div","overlay"),m=el("div","modal");
  m.appendChild(el("div","modal-title",title));
  m.appendChild(el("div","modal-text",hint));
  var t=ta("Paste here — one item per line","",8);t.style.marginBottom="12px";m.appendChild(t);
  var row=el("div","modal-btns");
  var cancel=el("button","btn-ghost","Cancel"),add=el("button","btn-primary","Add items");
  function close(){if(o.parentNode)o.parentNode.removeChild(o);}
  cancel.onclick=close;
  add.onclick=function(){var lines=t.value.split(/\n/),out=[];for(var i=0;i<lines.length;i++){if(lines[i].trim())out.push(lines[i].trim());}close();if(out.length)onDone(out);};
  row.appendChild(cancel);row.appendChild(add);m.appendChild(row);o.appendChild(m);
  o.onclick=function(ev){if(ev.target===o)close();};
  document.body.appendChild(o);setTimeout(function(){t.focus();},100);
}

// Two-column rows (name + amount). Rebuilds only on add/remove, never while typing.
function renderRowEditor(items,opts){
  var wrap=el("div"),c1=opts.col1key||"name",c2=opts.col2key||"amount";
  function changed(){if(opts.onChange)opts.onChange();}
  function rebuild(){
    wrap.innerHTML="";
    for(var i=0;i<items.length;i++){(function(idx){
      var row=el("div","row-wrap");
      var a=inp(opts.col1ph||"",items[idx][c1]);a.oninput=function(){items[idx][c1]=this.value;changed();};
      var b=inp(opts.col2ph||"",items[idx][c2],opts.col2type||"text");if(opts.col2cls)b.className=opts.col2cls;b.oninput=function(){items[idx][c2]=this.value;changed();};
      var rb=el("button","remove-btn","×");rb.onclick=function(){items.splice(idx,1);rebuild();changed();};
      row.appendChild(a);row.appendChild(b);row.appendChild(rb);wrap.appendChild(row);
    })(i);}
    var br=el("div","btn-row");
    var ab=el("button","add-row-btn","+ "+(opts.addLabel||"Add"));
    ab.onclick=function(){var o={};o[c1]="";o[c2]="";items.push(o);rebuild();};br.appendChild(ab);
    if(opts.allowPaste){
      var pb=el("button","add-row-btn","📋 Paste list");
      pb.onclick=function(){showPasteModal("Paste "+(opts.pasteTitle||"items"),"One item per line. Amounts like '500g' or '2 tbsp' are detected automatically, and you can fix any line afterwards.",function(lines){
        for(var i=0;i<lines.length;i++){var p=parseIngredientLine(lines[i]);if(p){var o={};o[c1]=p.name;o[c2]=p.amount;items.push(o);}}
        rebuild();changed();
      });};
      br.appendChild(pb);
    }
    wrap.appendChild(br);
  }
  rebuild();return wrap;
}

function renderPhotoEditor(photos){
  var wrap=el("div");
  function rebuild(){
    wrap.innerHTML="";
    if(photos.length){
      var grid=el("div","photo-grid");
      for(var i=0;i<photos.length;i++){(function(idx,src){
        var pw=el("div","photo-wrap");
        var img=document.createElement("img");img.className="photo-edit-thumb";img.src=src;img.onclick=function(){showLightbox(src);};
        var x=el("button","photo-x","✕");x.onclick=function(){photos.splice(idx,1);rebuild();};
        pw.appendChild(img);pw.appendChild(x);grid.appendChild(pw);
      })(i,photos[i]);}
      wrap.appendChild(grid);
    }
    // iOS standalone mode needs the tap to land directly on the input, so it sits inside a label
    var label=document.createElement("label");label.className="add-photo-btn";
    var icon=el("span",null,"📷");icon.style.fontSize="17px";label.appendChild(icon);
    label.appendChild(document.createTextNode(photos.length?"Add more photos":"Add photo"));
    var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.multiple=true;
    fi.style.cssText="position:absolute;width:1px;height:1px;opacity:.01;overflow:hidden";
    fi.onchange=function(){
      var files=fi.files;if(!files||!files.length)return;
      var pending=files.length;
      for(var i=0;i<files.length;i++){compressImage(files[i],function(data){if(data)photos.push(data);pending--;if(pending===0)rebuild();});}
    };
    label.appendChild(fi);wrap.appendChild(label);
  }
  rebuild();return wrap;
}
function compressImage(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MAX=900,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.75));
    };
    img.onerror=function(){cb(null);};
    img.src=r.result;
  };
  r.onerror=function(){cb(null);};
  r.readAsDataURL(file);
}

  }
  function rebuild(){
    wrap.innerHTML="";
    for(var i=0;i<form.flours.length;i++){(function(idx){

function renderSourdoughForm(bake,isNew){
  var form=normalizeBake(deepCopy(bake));
  if(!form.flours.length)form.flours.push({name:"",grams:"",sifted:"No",extraction:""});
  var pk=form.id?bakeKey(form.id):null;
  var photos=(pk&&state.photoCache[pk])?state.photoCache[pk].slice():[];
  // Existing bakes: logged water grams are the truth, derive %; new bakes: derive grams from %
  if(form.water1G===""||form.water1G==null)recalcWater(form);else derivePcts(form);

  var wrap=el("div","form-wrap");
  wrap.appendChild(formHeader(isNew?"New Bake":bakeTitle(form),"Sourdough loaf",function(){setState({view:"list"});}));

  var statsEl=el("div","stats-grid");wrap.appendChild(statsEl);
  var h1El,w1El,h2El,w2El,flourEd;
  function renderStats(){renderStatsInto(statsEl,form);}
  // New bakes: your target % drives the water. Logged bakes: the water you actually added
  // stays fixed and the % is re-derived when you edit flour or levain.
  function refresh(){
    if(isNew){recalcWater(form);if(w1El)w1El.value=form.water1G;if(w2El)w2El.value=form.water2G;}
    else{derivePcts(form);if(h1El)h1El.value=form.hydration1Pct;if(h2El)h2El.value=form.hydration2Pct;}
    renderStats();if(flourEd)flourEd._updateBlend();
  }
  function pctEdited(){recalcWater(form);if(w1El)w1El.value=form.water1G;if(w2El)w2El.value=form.water2G;renderStats();}

  // Basics
  wrap.appendChild(sec("Basics",
    grid2(fld("Test #",bindNum(form,"testNum","#")),fld("Date",(function(){var e=inp("",form.date,"month");e.oninput=function(){form.date=this.value;};return e;})())),
    fld("Title / category (optional)",bindText(form,"title","e.g. Jalapeño cheddar, 2hr autolyse test"))
  ));
  wrap.appendChild(sec("Photos",renderPhotoEditor(photos)));

  // Levain → flour → hydration
  wrap.appendChild(sec("Levain build",renderLevainEditor(form,refresh)));
  flourEd=renderFlourEditor(form,refresh);
  wrap.appendChild(sec("Flour blend (mix)",flourEd));

  h1El=inp("%",form.hydration1Pct,"number");
  h1El.oninput=function(){form.hydration1Pct=this.value;pctEdited();};
  w1El=inp("g",form.water1G,"number");
  w1El.oninput=function(){form.water1G=this.value;var tf=totalFlourG(form);if(tf){form.hydration1Pct=round1((num(form.water1G)+levainWaterG(form))/tf*100);h1El.value=form.hydration1Pct;}renderStats();};
  h2El=inp("%",form.hydration2Pct,"number");
  h2El.oninput=function(){form.hydration2Pct=this.value;pctEdited();};
  w2El=inp("g",form.water2G,"number");
  w2El.oninput=function(){form.water2G=this.value;var tf=totalFlourG(form);if(tf){form.hydration2Pct=round1(num(form.water2G)/tf*100);h2El.value=form.hydration2Pct;}renderStats();};

function ingredientLine(prefix,name,grams,tf){
  var g=num(grams);
  return {name:prefix+" — "+name,amount:round1(g)+"g"+(tf?" ("+bakersPct(g,tf)+"%)":"")};
}
function learningsNotes(e){
  var parts=[];
  if(hasScore(e.score))parts.push("Score: "+e.score+"/10");
  if(e.ovenSpring)parts.push("Oven spring: "+e.ovenSpring);
  if(e.crumb)parts.push("Crumb: "+e.crumb);
  if(e.crust)parts.push("Crust: "+e.crust);
  if(e.taste)parts.push("Taste: "+e.taste);
  if(e.keyIssue)parts.push("Key issue: "+e.keyIssue);
  if(e.nextChange)parts.push("Next time: "+e.nextChange);
  if(e.notes)parts.push(e.notes);
  return parts.join("\n");
}
// Turn a logged bake/entry into a freeform recipe (first pass — editable afterwards)
function entryToRecipe(book,e){
  if(book==="yum")return {title:e.title||"",category:e.category||"",source:e.source||"",description:"",ingredients:deepCopy(e.ingredients||[]),steps:deepCopy(e.steps||[]),notes:learningsNotes(e)};
  if(e.format==="freeform")return {title:bakeTitle(e),source:"",description:"",ingredients:deepCopy(e.freeIngredients||[]),steps:deepCopy(e.freeSteps||[]),notes:learningsNotes(e)};
  var b=normalizeBake(deepCopy(e)),tf=totalFlourG(b),L=b.levain,ing=[],st=[],i;
  // Ingredients — prefixed by component
  for(i=0;i<L.starter.flours.length;i++){if(num(L.starter.flours[i].grams))ing.push(ingredientLine("Starter",L.starter.flours[i].name||"flour",L.starter.flours[i].grams,tf));}
  if(num(L.starter.waterG))ing.push(ingredientLine("Starter","Water",L.starter.waterG,tf));
  for(i=0;i<L.flours.length;i++){if(num(L.flours[i].grams))ing.push(ingredientLine("Levain",L.flours[i].name||"flour",L.flours[i].grams,tf));}
  if(num(L.waterG))ing.push(ingredientLine("Levain","Water",L.waterG,tf));
  for(i=0;i<b.flours.length;i++){if(num(b.flours[i].grams)){var f=b.flours[i];ing.push(ingredientLine("Mix",(f.name||"flour")+(f.sifted==="Yes"&&f.extraction?" (sifted, "+f.extraction+"% extraction)":""),f.grams,tf));}}
  if(num(b.water1G))ing.push(ingredientLine("Mix","Water",b.water1G,tf));
  if(num(b.water2G))ing.push(ingredientLine("Bassinage","Water",b.water2G,tf));
  if(num(b.saltG))ing.push(ingredientLine("Mix","Salt",b.saltG,tf));
  for(i=0;i<b.otherIngredients.length;i++){if(b.otherIngredients[i].name)ing.push(ingredientLine("Mix",b.otherIngredients[i].name,b.otherIngredients[i].amount,tf));}
  for(i=0;i<b.mixins.length;i++){if(b.mixins[i].name)ing.push({name:"Mix-in — "+b.mixins[i].name,amount:b.mixins[i].amount||""});}
  for(i=0;i<b.toppings.length;i++){if(b.toppings[i].name)ing.push({name:"Topping — "+b.toppings[i].name,amount:b.toppings[i].amount||""});}
  // Method — built from the process fields
  var lf=levainFlourG(b),lw=levainWaterG(b);
  if(lf||lw)st.push("Build levain: combine starter with "+round1(sumGrams(L.flours))+"g flour and "+round1(num(L.waterG))+"g water"+(num(L.buildHr)?"; ferment ~"+L.buildHr+" hr until ripe.":"."));
  if(num(b.autolyseHr))st.push("Autolyse: mix flour with "+round1(num(b.water1G))+"g water; rest "+b.autolyseHr+" hr"+(b.autolyseTempF?" (dough "+b.autolyseTempF+"°F).":"."));
  var add="Add levain and "+round1(num(b.saltG))+"g salt";
  var oth=[];for(i=0;i<b.otherIngredients.length;i++){if(b.otherIngredients[i].name)oth.push(b.otherIngredients[i].name.toLowerCase());}
  if(oth.length)add+=", plus "+oth.join(", ");
  if(!num(b.autolyseHr))add="Mix flour with "+round1(num(b.water1G))+"g water. "+add;
  add+=num(b.slapFoldMin)?"; slap and fold ~"+b.slapFoldMin+" min.":".";
  st.push(add);
  if(num(b.water2G))st.push("Bassinage: add "+round1(num(b.water2G))+"g water gradually.");
  var mx=[];for(i=0;i<b.mixins.length;i++){if(b.mixins[i].name)mx.push(b.mixins[i].name.toLowerCase());}
  if(mx.length)st.push("Fold in mix-ins: "+mx.join(", ")+".");
  if(num(b.bulkHr)){
    var bulk="Bulk ferment ~"+b.bulkHr+" hr"+(num(b.stretchFolds)?" with "+b.stretchFolds+" sets of stretch and folds":"");
    var temps=[];if(b.bulkStartTempF||b.bulkEndTempF)temps.push("dough "+(b.bulkStartTempF||"?")+"°F → "+(b.bulkEndTempF||"?")+"°F");if(b.ambientTempF)temps.push("room "+b.ambientTempF+"°F");
    st.push(bulk+(temps.length?" ("+temps.join(", ")+").":"."));

function importData(file){

    var photoWrites={},summary;

      for(var i=0;i<bakes.length;i++){if(bakes[i].photos&&bakes[i].photos.length)photoWrites[bakeKey(bakes[i].id)]=bakes[i].photos;delete bakes[i].photos;}
      var op=d.photos||{};for(var k in op){if(op.hasOwnProperty(k)&&op[k]&&op[k].length)photoWrites[bakeKey(k)]=op[k];}
      state.bakes=bakes;state.grains=d.grains||state.grains;state.recipes=d.recipes||[];
      summary=state.bakes.length+" bakes, "+state.grains.length+" grains, "+state.recipes.length+" recipes";
    }

    lsSet(YENTRY_KEY,state.yEntries);lsSet(YRECIPE_KEY,state.yRecipes);

  var hdr=el("div","hdr"),row=el("div","hdr-row"),tl=el("div");
  tl.appendChild(el("div","hdr-title",isCrumb?"🌾 Crumb Journal":"🍽️ Yum Journal"));
  tl.appendChild(el("div","hdr-sub",isCrumb?"Fresh-milled sourdough log":"Everyday cooking & recipes"));
  row.appendChild(tl);
  row.appendChild(btn("swap-btn",isCrumb?"🍽️ Yum →":"🌾 Crumb →",function(){switchBook(isCrumb?"yum":"crumb");}));
  hdr.appendChild(row);
  var nav=el("div","hdr-nav");
  var tabs=isCrumb?[["list","Journal",["list","form","formFreeform","formatPicker"]],["grains","Grains",["grains","grainForm"]],["recipes","Recipes",["recipes","recipeForm","recipeDetail"]]]
                  :[["yList","Journal",["yList","yForm"]],["yRecipes","Recipes",["yRecipes","yRecipeForm","yRecipeDetail"]]];
  for(var t=0;t<tabs.length;t++){(function(tab){nav.appendChild(btn("nav-btn"+(tab[2].indexOf(v)>=0?" active":""),tab[1],function(){setState({view:tab[0]});window.scrollTo(0,0);}));})(tabs[t]);}
  hdr.appendChild(nav);
  var util=el("div","hdr-nav");util.style.marginTop="8px";
  util.appendChild(btn("nav-btn util","💬 Ask Claude",askClaude));
  util.appendChild(btn("nav-btn util","⬇ Export",exportData));
  var impLabel=document.createElement("label");impLabel.className="nav-btn util";impLabel.style.position="relative";impLabel.style.overflow="hidden";impLabel.textContent="⬆ Import";
  var impInp=document.createElement("input");impInp.type="file";impInp.accept=".json,application/json";
  impInp.style.cssText="position:absolute;width:1px;height:1px;opacity:.01;overflow:hidden";
  impInp.onchange=function(){if(impInp.files[0]){if(window.confirm("Importing replaces what's currently in the app with the backup. Continue?"))importData(impInp.files[0]);impInp.value="";}};
  impLabel.appendChild(impInp);util.appendChild(impLabel);
  hdr.appendChild(util);
  app.appendChild(hdr);
  if(v==="list"||v==="yList")app.appendChild(storageBar());

  var c=el("div","content");
  if(v==="list"){
    var lh=el("div","list-hdr");lh.appendChild(el("div","list-count",state.bakes.length+" bake"+(state.bakes.length!==1?"s":"")+" logged"));
    lh.appendChild(btn("new-btn","+ New Bake",function(){setState({view:"formatPicker"});}));c.appendChild(lh);
    if(!state.bakes.length)c.appendChild(el("div","empty-state","No bakes yet. Tap + New Bake to log your first loaf."));
    var sb=state.bakes.slice().sort(function(a,b){return num(b.testNum)-num(a.testNum);});
    for(var i=0;i<sb.length;i++)c.appendChild(renderBakeCard(sb[i]));
  }
  else if(v==="formatPicker")c.appendChild(renderFormatPicker());
  else if(v==="form"&&state.selected)c.appendChild(renderSourdoughForm(state.selected,state.isNew));
  else if(v==="formFreeform"&&state.selected)c.appendChild(renderFreeformForm(state.selected,state.isNew));
  else if(v==="grains"){
    var gh=el("div","list-hdr");gh.appendChild(el("div","list-count",state.grains.length+" grain"+(state.grains.length!==1?"s":"")+" logged"));
    gh.appendChild(btn("new-btn","+ New Grain",function(){setState({view:"grainForm",selectedGrain:{id:null,name:"",farm:"",type:"",season:"",origin:"",tastingNotes:"",bestFor:"",rating:"",notes:""},isNewGrain:true});}));c.appendChild(gh);
    if(!state.grains.length)c.appendChild(el("div","empty-state","No grains yet."));
    var gs=state.grains.slice().sort(function(a,b){return (a.name||"").localeCompare(b.name||"");});
    for(var g=0;g<gs.length;g++)c.appendChild(renderGrainCard(gs[g]));
  }
  else if(v==="grainForm"&&state.selectedGrain)c.appendChild(renderGrainForm(state.selectedGrain,state.isNewGrain));
  else if(v==="yList"){
    var yh=el("div","list-hdr");yh.appendChild(el("div","list-count",state.yEntries.length+" entr"+(state.yEntries.length!==1?"ies":"y")));
    yh.appendChild(btn("new-btn","+ New Entry",function(){setState({view:"yForm",isNew:true,selected:{id:null,title:"",date:todayDate(),category:"",source:"",ingredients:[],steps:[],score:"",keyIssue:"",nextChange:"",notes:""}});}));c.appendChild(yh);
    var fr=filterChips(state.yFilter,state.yEntries,function(cat){setState({yFilter:cat});});if(fr)c.appendChild(fr);
    if(!state.yEntries.length)c.appendChild(el("div","empty-state","Nothing logged yet. Tap + New Entry to record something you cooked."));
    var ye=state.yEntries.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(num(b.id)-num(a.id));});
    for(var y=0;y<ye.length;y++){if(state.yFilter==="All"||ye[y].category===state.yFilter)c.appendChild(renderYEntryCard(ye[y]));}
  }
  else if(v==="yForm"&&state.selected)c.appendChild(renderYEntryForm(state.selected,state.isNew));
  else if(v==="recipes"||v==="yRecipes"){
    var book=v==="recipes"?"crumb":"yum",list=getRecipes(book),rv=recipeViews(book);
    var rh=el("div","list-hdr");rh.appendChild(el("div","list-count",list.length+" recipe"+(list.length!==1?"s":"")));
    rh.appendChild(btn("new-btn","+ New Recipe",function(){var p={selectedRecipe:{id:null,title:"",category:"",source:"",description:"",ingredients:[],steps:[],notes:""},isNewRecipe:true};p.view=rv.form;setState(p);}));c.appendChild(rh);
    if(book==="yum"){var rf=filterChips(state.yrFilter,list,function(cat){setState({yrFilter:cat});});if(rf)c.appendChild(rf);}
    if(!list.length)c.appendChild(el("div","empty-state","No recipes yet. Add one here, or tap “Save as recipe” on any journal entry."));
    var rs=list.slice().sort(function(a,b){return (a.title||"").localeCompare(b.title||"");});
    for(var r=0;r<rs.length;r++){if(book==="crumb"||state.yrFilter==="All"||rs[r].category===state.yrFilter)c.appendChild(renderRecipeCard(rs[r],book));}
  }
  else if((v==="recipeForm"||v==="yRecipeForm")&&state.selectedRecipe)c.appendChild(renderRecipeForm(state.selectedRecipe,state.isNewRecipe,v==="recipeForm"?"crumb":"yum"));
  else if((v==="recipeDetail"||v==="yRecipeDetail")&&state.recipeDetail)c.appendChild(renderRecipeDetail(state.recipeDetail,v==="recipeDetail"?"crumb":"yum"));
  else {state.view=isCrumb?"list":"yList";return draw();}
  app.appendChild(c);
}

try{renumberBakes();render();}
catch(e){document.getElementById("app").innerHTML='<div style="padding:24px;font-family:monospace;font-size:13px;color:#a00">Something went wrong: '+(e&&e.message)+'</div>';}
</script>
</body>
</html>
